<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Napp OS organization homepage.">
  <title>Napp OS</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f4f1e9;
      --text: #182822;
      --muted: #45574f;
      --accent: #1d624b;
      --line: #a2b3a9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #14211c;
        --text: #edf4eb;
        --muted: #b0c2b8;
        --accent: #a0dec5;
        --line: #647e70;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      align-items: center;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(calc(100% - 3rem), 46rem);
      margin-inline: auto;
      padding-block: 4rem;
      border-block: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 8rem);
      line-height: 1;
      letter-spacing: -0.075em;
    }

    p {
      margin: 1.25rem 0 2rem;
      color: var(--muted);
      font-size: clamp(1.15rem, 3vw, 1.6rem);
    }

    a {
      color: var(--accent);
      font-weight: 650;
      text-underline-offset: 0.25em;
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 0.4rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Napp OS</h1>
    <p>NAPP is Not APP.</p>
    <a href="https://github.com/Napp-OS">Napp OS on GitHub</a>
  </main>
</body>
</html>
